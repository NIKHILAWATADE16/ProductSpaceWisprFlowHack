server:
  port: ${PORT:8080}

spring:
  application:
    name: personal-finance-coach
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financecoach}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

financecoach:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d0e2b4a7c9f1e3d5b7a9c1e3f5a7b9c1d3e5f7a9b1c3d}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:}
    model: ${LLM_MODEL:gemini-3.5-flash}
    fallback-model: ${LLM_FALLBACK_MODEL:gemini-3.5-flash-lite}
    api-url: ${LLM_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.financecoach: INFO
    org.springframework.security: WARN

